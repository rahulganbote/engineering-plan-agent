name: react-ci

# Runs on every push to the React migration branch + every PR targeting it.
# Goal: catch typecheck + lint + test regressions before they land on the branch.
on:
  push:
    branches:
      - dev-react-ui-upgrade
    paths:
      - 'frontend/**'
      - '.github/workflows/react-ci.yml'
  pull_request:
    branches:
      - dev-react-ui-upgrade
    paths:
      - 'frontend/**'
      - '.github/workflows/react-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + component tests (Vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact (for Sprint 6 Docker bundling)
        if: github.ref == 'refs/heads/dev-react-ui-upgrade'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
