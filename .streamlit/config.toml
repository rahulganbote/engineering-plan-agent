# Streamlit server configuration for EM Copilot
# Reload requires restarting the Streamlit process (HF Space rebuild does this).

[server]
# Maximum BRD upload size in MB. Must match max_brd_file_size_mb in
# src/core/config.py — keep both in sync so the UI display agrees with
# the server-side security validator.
maxUploadSize = 5

# Enable XSRF protection (default true, listed for clarity)
enableXsrfProtection = true

# Don't auto-collect anonymous usage stats from the deployed Space
gatherUsageStats = false

[browser]
# Hide Streamlit's "made with Streamlit" footer in iframes (HF Spaces look)
gatherUsageStats = false

[theme]
# Keep the default light theme — matches the screenshots in README
base = "light"
